<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotlive Proxy Tool</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Fotlive Proxy Tool</h1>
                <p class="text-gray-600">Enter a URL to generate a proxied link</p>
            </div>

            
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <div class="mb-4">
                    <label for="url" class="block text-gray-700 text-sm font-bold mb-2">Target URL:</label>
                    <input type="url" id="url" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                           placeholder="https://example.com">
                </div>
                <button onclick="generateProxyUrl()" 
                        class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-200">
                    Generate Proxy URL
                </button>
            </div>

            
            <div id="result" class="hidden bg-white rounded-lg shadow-md p-6">
                
                <h2 class="text-lg font-bold text-gray-800 mb-3">Generated Proxy URL:</h2>
                <div class="relative">
                    <input type="text" id="proxyUrl" 
                           class="w-full px-3 py-2 pr-20 border border-gray-300 rounded-lg bg-gray-50" 
                           readonly>
                    <button onclick="copyToClipboard('proxyUrl')" 
                            class="absolute right-2 top-1/2 transform -translate-y-1/2 text-blue-500 hover:text-blue-600"
                            title="Copy encoded URL">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
                
                
                <div class="mt-4">
                    <h3 class="text-sm font-bold text-gray-700 mb-2">Decoded URL:</h3>
                    <div class="relative">
                        <input type="text" id="decodedUrl" 
                               class="w-full px-3 py-2 pr-20 border border-gray-300 rounded-lg bg-gray-50"
                               readonly>
                        <button onclick="copyToClipboard('decodedUrl')" 
                                class="absolute right-2 top-1/2 transform -translate-y-1/2 text-blue-500 hover:text-blue-600"
                                title="Copy decoded URL">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </div>
                
                
                <div id="copyStatus" class="mt-2 text-center text-sm hidden"></div>
            </div>
        </div>
    </div>

    <script>
        function generateProxyUrl() {
            const url = document.getElementById('url').value;
            if (!url) {
                alert('Please enter a valid URL');
                return;
            }

            const proxyUrl = `${window.location.origin}${window.location.pathname.replace('index.html', '')}fotlive.php?url=${encodeURIComponent(url)}`;
            document.getElementById('proxyUrl').value = proxyUrl;
            document.getElementById('decodedUrl').value = decodeURIComponent(proxyUrl);
            document.getElementById('result').classList.remove('hidden');
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            element.select();
            document.execCommand('copy');

            const copyStatus = document.getElementById('copyStatus');
            copyStatus.textContent = `${elementId === 'proxyUrl' ? 'Encoded' : 'Decoded'} URL copied to clipboard!`;
            copyStatus.classList.remove('hidden');
            copyStatus.classList.add('text-green-500');

            setTimeout(() => {
                copyStatus.classList.add('hidden');
            }, 2000);
        }
    </script>
</body>
</html>
